<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 1. Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-600">MyBrand</div>
            <ul class="hidden md:flex space-x-8 font-medium">
                <li><a href="#hero" class="hover:text-blue-600 transition">হোম</a></li>
                <li><a href="#features" class="hover:text-blue-600 transition">ফিচার</a></li>
                <li><a href="#pricing" class="hover:text-blue-600 transition">প্রাইসিং</a></li>
                <li><a href="#contact" class="hover:text-blue-600 transition">যোগাযোগ</a></li>
            </ul>
            <div class="hidden md:block">
                <a href="#pricing" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold transition">শুরু করুন</a>
            </div>
            <button id="menu-btn" class="md:hidden focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t px-6 py-4 space-y-4">
            <a href="#hero" class="block hover:text-blue-600 font-medium">হোম</a>
            <a href="#features" class="block hover:text-blue-600 font-medium">ফিচার</a>
            <a href="#pricing" class="block hover:text-blue-600 font-medium">প্রাইসিং</a>
            <a href="#contact" class="block hover:text-blue-600 font-medium">যোগাযোগ</a>
        </div>
    </nav>
    <!-- 2. Hero Section -->
    <section id="hero" class="container mx-auto px-6 py-16 md:py-24 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        <div class="space-y-6">
            <span class="bg-blue-100 text-blue-600 text-sm font-semibold px-3 py-1 rounded-full">আধুনিক ওয়েব সলিউশন</span>
            <h1 class="text-4xl md:text-5xl font-extrabold leading-tight">আপনার ব্যবসাকে নিয়ে যান <span class="text-blue-600">পরবর্তী ধাপে</span></h1>
            <p class="text-gray-600 text-lg">Tailwind CSS দিয়ে খুব সহজেই রেসপন্সিভ এবং আধুনিক ডিজাইন তৈরি করুন কোনো ঝামেলা ছাড়াই।</p>
            <div class="flex space-x-4">
                <a href="#pricing" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-200">প্যাকেজ দেখুন</a>
                <a href="#contact" class="border border-gray-300 hover:border-gray-400 font-semibold px-6 py-3 rounded-xl transition">যোগাযোগ</a>
            </div>
            
        </div>
        <div class="bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-3xl p-8 text-white shadow-2xl flex items-center justify-center h-80 md:h-96">
            <div class="text-center">
                <span class="text-6xl font-bold">🚀</span>
                <h3 class="text-2xl font-bold mt-4">Tailwind Pro</h3>
                <p class="text-blue-100 mt-2">ফাস্ট এবং রেসপন্সিভ ডিজাইন</p>
            </div>
        </div>
    </section>
    
</body>
</html>
