<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <!-- Hero Section Start -->
    <section class="container mx-auto px-6 py-16 md:py-24 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
    
    <!-- Left Side: Text Content -->
        <div class="space-y-6">
            <span class="bg-blue-100 text-blue-600 text-sm font-semibold px-3 py-1 rounded-full">
                নতুন ফিচারের সাথে পরিচিত হোন
            </span>
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 leading-tight">
                আপনার ব্যবসাকে নিয়ে যান <span class="text-blue-600">পরবর্তী ধাপে</span>
            </h1>
            <p class="text-lg text-gray-600">
                Tailwind CSS দিয়ে খুব সহজেই রেসপন্সিভ এবং আধুনিক ডিজাইন তৈরি করুন কোনো ঝামেলা ছাড়াই। কোড লিখুন দ্রুত, সাশ্রয় করুন সময়।
            </p>
            <div class="flex space-x-4">
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-200">
                    শুরু করুন
                </button>
                <button class="border border-gray-300 hover:border-gray-400 text-gray-700 font-semibold px-6 py-3 rounded-xl transition">
                    আরও জানুন
                </button>
            </div>
        </div>

        <!-- Right Side: Image / Box -->
        <div class="bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-3xl p-8 text-white shadow-2xl flex items-center justify-center h-80 md:h-96">
            <div class="text-center">
                <span class="text-6xl font-bold">🚀</span>
                <h3 class="text-2xl font-bold mt-4">Modern UI/UX</h3>
                <p class="text-blue-100 mt-2">ফাস্ট এবং রেসপন্সিভ ডিজাইন</p>
            </div>
        </div>

    </section>
    <!-- Hero Section End -->




</body>
</html>
